services:
  postgres:
    image: postgres:16-alpine
    container_name: saga-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: saga
      POSTGRES_PASSWORD: saga
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saga -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.0.0
    container_name: saga-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  booking-service:
    image: docker.io/library/booking-service:0.0.1-SNAPSHOT
    container_name: saga-booking-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/booking_db
      DB_USER: saga
      DB_PASSWORD: saga
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      # 15 minutes: Step 7's 5s was tuned for watching the reaper fire in a
      # demo. Under real load, inventory's single-threaded consumer can take
      # minutes to work through a backlog, and this must stay well clear of
      # that or it reaps bookings before the saga gets a chance to resolve
      # them naturally.
      BOOKING_SAGA_TIMEOUT_SECONDS: "900"
      INVENTORY_DB_URL: jdbc:postgresql://postgres:5432/inventory_db
      PAYMENT_DB_URL: jdbc:postgresql://postgres:5432/payment_db
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  inventory-service:
    image: docker.io/library/inventory-service:0.0.1-SNAPSHOT
    container_name: saga-inventory-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/inventory_db
      DB_USER: saga
      DB_PASSWORD: saga
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      # Same reasoning as booking's saga timeout above: a seat held behind
      # the same backlog could expire before ConfirmSeats ever arrives.
      INVENTORY_HOLD_DURATION_SECONDS: "900"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  payment-service:
    image: docker.io/library/payment-service:0.0.1-SNAPSHOT
    container_name: saga-payment-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/payment_db
      DB_USER: saga
      DB_PASSWORD: saga
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  pgdata: